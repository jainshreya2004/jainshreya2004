<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <!-- Rich Midnight Navy Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="50%" stop-color="#09132a"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>

    <!-- Animated Tricolor Gradient: Vibrant Blue + Mint Green + Pearl Pink -->
    <linearGradient id="name-grad" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="650" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ff9ac8"/>
      <animate attributeName="x1" values="150;750;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="650;1250;650" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f5a0" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff9ac8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Laser Border Gradient: Blue -> Green -> Pearl Pink -->
    <linearGradient id="bd-mix" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ff9ac8"/>
    </linearGradient>

    <radialGradient id="vig">
      <stop offset="0%" stop-color="#050a17" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050a17" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1000" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- Ambient Glowing Orbs: Blue + Green + Pearl Pink -->
    <g filter="url(#blur)">
      <!-- Vibrant Blue Orb -->
      <circle cx="180" cy="90" r="135" fill="#00d2ff" opacity="0.35">
        <animate attributeName="cx" values="180;380;180" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;230;90" dur="13s" repeatCount="indefinite"/>
      </circle>
      <!-- Vibrant Mint Green Orb -->
      <circle cx="820" cy="240" r="140" fill="#00f5a0" opacity="0.32">
        <animate attributeName="cx" values="820;620;820" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;90;240" dur="10s" repeatCount="indefinite"/>
      </circle>
      <!-- Pearl Pink Orb -->
      <circle cx="500" cy="170" r="115" fill="#ff9ac8" opacity="0.30">
        <animate attributeName="r" values="115;165;115" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Binary Rain: Blue, Green, Pearl Pink columns -->
    <g font-family="Courier New,monospace" font-size="15">
      <!-- Blue Column -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="8.7s" begin="-4.9s" repeatCount="indefinite"/><text x="25" y="0" fill="#00d2ff" opacity="0.75">1</text><text x="25" y="-17" fill="#00d2ff" opacity="0.6">0</text><text x="25" y="-34" fill="#00d2ff" opacity="0.5">1</text><text x="25" y="-51" fill="#00d2ff" opacity="0.35">0</text></g>
      <!-- Green Column -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="9.6s" begin="-3.8s" repeatCount="indefinite"/><text x="90" y="0" fill="#00f5a0" opacity="0.75">0</text><text x="90" y="-17" fill="#00f5a0" opacity="0.6">1</text><text x="90" y="-34" fill="#00f5a0" opacity="0.5">1</text><text x="90" y="-51" fill="#00f5a0" opacity="0.35">0</text></g>
      <!-- Pearl Pink Column -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="8.2s" begin="-2.1s" repeatCount="indefinite"/><text x="160" y="0" fill="#ff9ac8" opacity="0.75">1</text><text x="160" y="-17" fill="#ff9ac8" opacity="0.6">0</text><text x="160" y="-34" fill="#ff9ac8" opacity="0.5">0</text><text x="160" y="-51" fill="#ff9ac8" opacity="0.35">1</text></g>
      <!-- Blue Column Right -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="10.5s" begin="-5.3s" repeatCount="indefinite"/><text x="840" y="0" fill="#00d2ff" opacity="0.75">1</text><text x="840" y="-17" fill="#00d2ff" opacity="0.6">0</text><text x="840" y="-34" fill="#00d2ff" opacity="0.5">1</text></g>
      <!-- Mint Green Column Right -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="9.1s" begin="-1.5s" repeatCount="indefinite"/><text x="910" y="0" fill="#00f5a0" opacity="0.75">0</text><text x="910" y="-17" fill="#00f5a0" opacity="0.6">1</text><text x="910" y="-34" fill="#00f5a0" opacity="0.45">0</text></g>
      <!-- Pearl Pink Column Right -->
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="11.2s" begin="-4.2s" repeatCount="indefinite"/><text x="965" y="0" fill="#ff9ac8" opacity="0.75">1</text><text x="965" y="-17" fill="#ff9ac8" opacity="0.6">1</text><text x="965" y="-34" fill="#ff9ac8" opacity="0.45">0</text></g>
    </g>

    <!-- Twinkling Stars -->
    <circle cx="230" cy="75" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="65" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="230" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="220" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>

    <!-- Center Vignette -->
    <ellipse cx="500" cy="170" rx="440" ry="120" fill="url(#vig)"/>

    <!-- Main Title: SHREYA JAIN (Blue + Green + Pearl Pink Mix) -->
    <text x="500" y="148" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="78" font-weight="800" letter-spacing="8" fill="url(#name-grad)" filter="url(#glow)">SHREYA JAIN</text>

    <!-- Subtitle: ONLY CYBERSECURITY ENTHUSIAST in Mint Green with Pearl Glow -->
    <text x="500" y="210" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#00f5a0" filter="url(#glow)">CYBERSECURITY ENTHUSIAST</text>

    <!-- Subtext -->
    <text x="500" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="4" fill="#bae6fd">B.TECH 4TH YEAR  //  CSJMU KANPUR</text>

    <!-- Scanning Line Sweep -->
    <rect x="0" y="-4" width="1000" height="3" fill="url(#scan)">
      <animate attributeName="y" from="-4" to="340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Frame -->
  <rect x="2" y="2" width="996" height="336" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Travelling Laser Border: Blue -> Green -> Pearl Pink -->
  <rect x="2" y="2" width="996" height="336" rx="21" fill="none" stroke="url(#bd-mix)" stroke-width="3" stroke-linecap="round" stroke-dasharray="260 2540" pathLength="2800">
    <animate attributeName="stroke-dashoffset" from="0" to="-2800" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>