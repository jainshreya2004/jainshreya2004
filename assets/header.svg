<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <!-- Background Pink Cyberpunk Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090111"/>
      <stop offset="50%" stop-color="#1c0529"/>
      <stop offset="100%" stop-color="#2a0538"/>
    </linearGradient>

    <!-- Shimmering Pink Gradient for Name -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
      <animate attributeName="x1" values="200;700;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;1000;500" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Laser Border Gradient -->
    <linearGradient id="bd" x1="0" x2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <radialGradient id="vig">
      <stop offset="0%" stop-color="#090111" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090111" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1000" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- Ambient Glowing Pink Orbs -->
    <g filter="url(#blur)">
      <circle cx="180" cy="90" r="130" fill="#ec4899" opacity="0.38">
        <animate attributeName="cx" values="180;420;180" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;240;90" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="250" r="140" fill="#f43f5e" opacity="0.35">
        <animate attributeName="cx" values="820;560;820" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;80;250" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="170" r="110" fill="#d946ef" opacity="0.32">
        <animate attributeName="r" values="110;160;110" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Binary Matrix Rain in Pink -->
    <g font-family="Courier New,monospace" font-size="15">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="8.7s" begin="-4.9s" repeatCount="indefinite"/><text x="18" y="0" fill="#f472b6" opacity="0.7">1</text><text x="18" y="-17" fill="#f472b6" opacity="0.6">0</text><text x="18" y="-34" fill="#f472b6" opacity="0.5">1</text><text x="18" y="-51" fill="#f472b6" opacity="0.4">0</text><text x="18" y="-68" fill="#f472b6" opacity="0.3">1</text></g>
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="9.6s" begin="-3.8s" repeatCount="indefinite"/><text x="75" y="0" fill="#ff79c6" opacity="0.7">0</text><text x="75" y="-17" fill="#ff79c6" opacity="0.6">1</text><text x="75" y="-34" fill="#ff79c6" opacity="0.5">1</text><text x="75" y="-51" fill="#ff79c6" opacity="0.4">0</text></g>
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="8.2s" begin="-2.1s" repeatCount="indefinite"/><text x="140" y="0" fill="#fda4af" opacity="0.6">1</text><text x="140" y="-17" fill="#fda4af" opacity="0.5">0</text><text x="140" y="-34" fill="#fda4af" opacity="0.4">0</text></g>
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="10.5s" begin="-5.3s" repeatCount="indefinite"/><text x="860" y="0" fill="#f472b6" opacity="0.7">1</text><text x="860" y="-17" fill="#f472b6" opacity="0.6">0</text><text x="860" y="-34" fill="#f472b6" opacity="0.5">1</text></g>
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="0 570" dur="9.1s" begin="-1.5s" repeatCount="indefinite"/><text x="925" y="0" fill="#ff79c6" opacity="0.7">0</text><text x="925" y="-17" fill="#ff79c6" opacity="0.6">1</text><text x="925" y="-34" fill="#ff79c6" opacity="0.4">0</text></g>
    </g>

    <!-- Twinkling Stars -->
    <circle cx="240" cy="80" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="70" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="230" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="220" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>

    <!-- Center Vignette -->
    <ellipse cx="500" cy="170" rx="440" ry="120" fill="url(#vig)"/>

    <!-- Main Title: SHREYA JAIN -->
    <text x="500" y="148" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="78" font-weight="800" letter-spacing="8" fill="url(#name)" filter="url(#glow)">SHREYA JAIN</text>

    <!-- Subtitle: ONLY CYBERSECURITY ENTHUSIAST (Static, crisp, spelled properly) -->
    <text x="500" y="210" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#f472b6" filter="url(#glow)">CYBERSECURITY ENTHUSIAST</text>

    <!-- Tertiary Info -->
    <text x="500" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="4" fill="#fda4af">B.TECH 4TH YEAR  //  CSJMU KANPUR</text>

    <!-- Scanline Sweep -->
    <rect x="0" y="-4" width="1000" height="3" fill="url(#scan)">
      <animate attributeName="y" from="-4" to="340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Border Frame -->
  <rect x="2" y="2" width="996" height="336" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Travelling Pink Laser Border -->
  <rect x="2" y="2" width="996" height="336" rx="21" fill="none" stroke="url(#bd)" stroke-width="3" stroke-linecap="round" stroke-dasharray="260 2540" pathLength="2800">
    <animate attributeName="stroke-dashoffset" from="0" to="-2800" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>