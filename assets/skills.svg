<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0a142e"/>
      <stop offset="100%" stop-color="#112247"/>
    </linearGradient>

    <!-- Laser Border Gradient: Blue -> Green -> Pearl Pink -->
    <linearGradient id="sk-bd-mix" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ff9ac8"/>
    </linearGradient>

    <clipPath id="sk-clip">
      <rect width="900" height="340" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sk-clip)">
    <rect width="900" height="340" fill="url(#sk-bg)"/>

    <!-- Ambient Glow Lights -->
    <circle cx="150" cy="80" r="100" fill="#00d2ff" opacity="0.18"/>
    <circle cx="450" cy="260" r="110" fill="#00f5a0" opacity="0.16"/>
    <circle cx="750" cy="80" r="100" fill="#ff9ac8" opacity="0.18"/>

    <!-- Category 1: Languages & Web (Pearl Pink Highlights) -->
    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="4" height="18" rx="2" fill="#ff9ac8"/>
      <text x="12" y="14" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#ff9ac8">LANGUAGES &amp; WEB</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="125" height="32" rx="10" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="62.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🐍 Python</text>

        <rect x="135" y="0" width="115" height="32" rx="10" fill="#0e172e" stroke="#f472b6" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="192.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">⚡ C++</text>

        <rect x="260" y="0" width="145" height="32" rx="10" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="332.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">📜 JavaScript</text>
      </g>

      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="115" height="32" rx="10" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="57.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">⚛️ React</text>

        <rect x="125" y="0" width="135" height="32" rx="10" fill="#0e172e" stroke="#f472b6" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="192.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🌐 HTML5 &amp; CSS3</text>

        <rect x="270" y="0" width="135" height="32" rx="10" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="337.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🎨 TailwindCSS</text>
      </g>
    </g>

    <!-- Category 2: Tools & Databases (Vibrant Blue Highlights) -->
    <g transform="translate(460, 24)">
      <rect x="0" y="0" width="4" height="18" rx="2" fill="#00d2ff"/>
      <text x="12" y="14" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#00d2ff">TOOLS &amp; DATABASES</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="130" height="32" rx="10" fill="#0e172e" stroke="#00d2ff" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="65" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🗄️ MySQL &amp; SQL</text>

        <rect x="140" y="0" width="125" height="32" rx="10" fill="#0e172e" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="202.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🐧 Linux (Ubuntu)</text>

        <rect x="275" y="0" width="135" height="32" rx="10" fill="#0e172e" stroke="#00d2ff" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="342.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🐙 Git &amp; GitHub</text>
      </g>

      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="130" height="32" rx="10" fill="#0e172e" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="65" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">💻 VS Code</text>

        <rect x="140" y="0" width="135" height="32" rx="10" fill="#0e172e" stroke="#00d2ff" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="207.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">⚡ Vite &amp; Node.js</text>

        <rect x="285" y="0" width="125" height="32" rx="10" fill="#0e172e" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.2"/>
        <text x="347.5" y="20.5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🔍 Wireshark</text>
      </g>
    </g>

    <line x1="30" y1="152" x2="870" y2="152" stroke="#00f5a0" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Category 3: Core CS & Cybersecurity Concepts (Mint Green Highlights) -->
    <g transform="translate(30, 172)">
      <rect x="0" y="0" width="4" height="18" rx="2" fill="#00f5a0"/>
      <text x="12" y="14" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#00f5a0">CORE CS &amp; CYBERSECURITY CONCEPTS</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="265" height="36" rx="12" fill="#0e172e" stroke="#00f5a0" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="132.5" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">📊 Data Structures &amp; Algorithms</text>

        <rect x="280" y="0" width="265" height="36" rx="12" fill="#0e172e" stroke="#00d2ff" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="412.5" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🔬 Digital Forensics &amp; File Carving</text>

        <rect x="560" y="0" width="280" height="36" rx="12" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="700" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🔐 Cryptography &amp; Merkle Trees</text>
      </g>

      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="265" height="36" rx="12" fill="#0e172e" stroke="#00d2ff" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="132.5" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🖥️ Operating Systems</text>

        <rect x="280" y="0" width="265" height="36" rx="12" fill="#0e172e" stroke="#00f5a0" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="412.5" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🌐 Computer Networks (TCP/IP)</text>

        <rect x="560" y="0" width="280" height="36" rx="12" fill="#0e172e" stroke="#ff9ac8" stroke-opacity="0.75" stroke-width="1.5"/>
        <text x="700" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">🗄️ Database Management (DBMS)</text>
      </g>
    </g>
  </g>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="336" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Laser Border: Blue -> Green -> Pearl Pink -->
  <rect x="2" y="2" width="896" height="336" rx="15" fill="none" stroke="url(#sk-bd-mix)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="240 2200" pathLength="2440">
    <animate attributeName="stroke-dashoffset" from="0" to="-2440" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
