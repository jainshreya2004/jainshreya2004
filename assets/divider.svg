<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30">
  <defs>
    <linearGradient id="d" x1="0" x2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <!-- Main Glowing Line -->
  <rect x="0" y="14" width="1000" height="2" fill="url(#d)"/>
  <!-- Glowing Traveling Orb -->
  <circle r="7" cy="15" fill="#f472b6" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="15" fill="#fff">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Center Rotating Diamond -->
  <g transform="translate(500 15)">
    <rect x="-8" y="-8" width="16" height="16" fill="#170424" stroke="#f472b6" stroke-width="2" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>