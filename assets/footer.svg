<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0d0926"/>
      <stop offset="100%" stop-color="#051a26"/>
    </linearGradient>

    <!-- Animated Gradient for Heading -->
    <linearGradient id="f-name" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fbbf24"/>
      <animate attributeName="x1" values="200;700;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;1100;600" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Waves Gradients -->
    <linearGradient id="w1" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1%" stop-color="#e879f9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Border Pulse Gradient -->
    <linearGradient id="bd" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="f-blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <clipPath id="f-clip">
      <rect width="1000" height="220" rx="20"/>
    </clipPath>
  </defs>

  <!-- Clip inside rounded card -->
  <g clip-path="url(#f-clip)">
    <!-- Main Background -->
    <rect width="1000" height="220" fill="url(#f-bg)"/>

    <!-- Ambient Glowing Light Orbs -->
    <g filter="url(#f-blur)">
      <circle cx="200" cy="110" r="100" fill="#22d3ee" opacity="0.32">
        <animate attributeName="cx" values="200;450;200" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="120" r="110" fill="#e879f9" opacity="0.32">
        <animate attributeName="cx" values="800;550;800" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="90" r="80" fill="#8b5cf6" opacity="0.25">
        <animate attributeName="r" values="80;120;80" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Twinkling Stars -->
    <circle cx="120" cy="45" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="65" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.3" fill="#fff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="35" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="60" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="140" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="150" r="1.3" fill="#fff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></circle>

    <!-- Animated Synth Waves at Bottom -->
    <path fill="url(#w2)" d="M0,150 C200,105 320,195 500,150 S800,105 1000,150 L1000,220 L0,220 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,150 C200,105 320,195 500,150 S800,105 1000,150 L1000,220 L0,220 Z;M0,140 C200,190 320,110 500,140 S800,190 1000,140 L1000,220 L0,220 Z;M0,150 C200,105 320,195 500,150 S800,105 1000,150 L1000,220 L0,220 Z"/>
    </path>
    <path fill="url(#w1)" d="M0,165 C250,125 350,200 550,165 S850,125 1000,165 L1000,220 L0,220 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0,165 C250,125 350,200 550,165 S850,125 1000,165 L1000,220 L0,220 Z;M0,160 C250,195 350,130 550,160 S850,195 1000,160 L1000,220 L0,220 Z;M0,165 C250,125 350,200 550,165 S850,125 1000,165 L1000,220 L0,220 Z"/>
    </path>

    <!-- Decorative Top Diamond -->
    <g transform="translate(500, 26)">
      <rect x="-6" y="-6" width="12" height="12" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5" transform="rotate(45)">
        <animateTransform attributeName="transform" type="rotate" values="45;405" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Main Title with Glow and Gradient Animation -->
    <text x="500" y="78" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="7" fill="url(#f-name)" filter="url(#f-glow)">
      THANKS FOR STOPPING BY
    </text>

    <!-- Subtitle -->
    <text x="500" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="14.5" letter-spacing="2.5" fill="#e2e8f0">
      let's learn, secure &amp; build together • open to collaborations
    </text>

    <!-- Cyber Tags Pill Row -->
    <g transform="translate(500, 142)">
      <!-- Cyber Pill 1 -->
      <g transform="translate(-210, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#0b1020" fill-opacity="0.8" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#22d3ee">🔐 SECURITY</text>
      </g>
      <!-- Cyber Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0b1020" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c084fc">⚡ FORENSICS &amp; DSA</text>
      </g>
      <!-- Cyber Pill 3 -->
      <g transform="translate(210, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0b1020" fill-opacity="0.8" stroke="#e879f9" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#e879f9">🚀 HACKATHONS</text>
      </g>
    </g>
  </g>

  <!-- Card Border -->
  <rect x="2" y="2" width="996" height="216" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Travelling Neon Laser Pulse Border -->
  <rect x="2" y="2" width="996" height="216" rx="19" fill="none" stroke="url(#bd)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="240 2200" pathLength="2440">
    <animate attributeName="stroke-dashoffset" from="0" to="-2440" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>