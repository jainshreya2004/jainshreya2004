<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <defs>
    <!-- Background Gradient: Midnight Navy -->
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0a142e"/>
      <stop offset="100%" stop-color="#112247"/>
    </linearGradient>

    <!-- Shimmering Heading Gradient: Blue -> Green -> Pearl Pink -->
    <linearGradient id="f-mix-title" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ff9ac8"/>
      <animate attributeName="x1" values="200;700;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;1100;600" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Wave 1: Vibrant Blue -->
    <linearGradient id="w-blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.5"/>
      <stop offset="1%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Wave 2: Pearl Pink -->
    <linearGradient id="w-pink" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff9ac8" stop-opacity="0.45"/>
      <stop offset="1%" stop-color="#f472b6" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Border Pulse Gradient: Blue -> Green -> Pearl Pink -->
    <linearGradient id="f-bd-mix" x1="0" x2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ff9ac8"/>
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="f-blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <clipPath id="f-clip">
      <rect width="1000" height="220" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#f-clip)">
    <rect width="1000" height="220" fill="url(#f-bg)"/>

    <!-- Ambient Glowing Orbs: Blue + Green + Pearl Pink -->
    <g filter="url(#f-blur)">
      <circle cx="200" cy="110" r="100" fill="#00d2ff" opacity="0.30">
        <animate attributeName="cx" values="200;450;200" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="120" r="110" fill="#ff9ac8" opacity="0.30">
        <animate attributeName="cx" values="800;550;800" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="90" r="85" fill="#00f5a0" opacity="0.25">
        <animate attributeName="r" values="85;125;85" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Twinkling Stars -->
    <circle cx="120" cy="45" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="40" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="25" r="1.6" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="40" r="1.3" fill="#fff"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="45" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>

    <!-- Animated Synth Waves at Bottom (Blue and Pearl Pink Waves) -->
    <path fill="url(#w-blue)" d="M0,165 C200,125 320,205 500,165 S800,125 1000,165 L1000,220 L0,220 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,165 C200,125 320,205 500,165 S800,125 1000,165 L1000,220 L0,220 Z;M0,155 C200,200 320,130 500,155 S800,200 1000,155 L1000,220 L0,220 Z;M0,165 C200,125 320,205 500,165 S800,125 1000,165 L1000,220 L0,220 Z"/>
    </path>
    <path fill="url(#w-pink)" d="M0,175 C250,140 350,210 550,175 S850,140 1000,175 L1000,220 L0,220 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0,175 C250,140 350,210 550,175 S850,140 1000,175 L1000,220 L0,220 Z;M0,170 C250,205 350,145 550,170 S850,205 1000,170 L1000,220 L0,220 Z;M0,175 C250,140 350,210 550,175 S850,140 1000,175 L1000,220 L0,220 Z"/>
    </path>

    <!-- Center Rotating Diamond in Mint Green & Pearl -->
    <g transform="translate(500, 22)">
      <rect x="-5" y="-5" width="10" height="10" fill="#0c1429" stroke="#00f5a0" stroke-width="1.5" transform="rotate(45)">
        <animateTransform attributeName="transform" type="rotate" values="45;405" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Main Title: Blue -> Mint Green -> Pearl Pink Gradient -->
    <text x="500" y="68" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="7" fill="url(#f-mix-title)" filter="url(#f-glow)">
      THANKS FOR STOPPING BY
    </text>

    <!-- Subtitle -->
    <text x="500" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="2.5" fill="#bae6fd">
      let's learn, secure &amp; build together • open to collaborations
    </text>

    <!-- Specialty Pill Tags: Green, Blue, Pearl Pink -->
    <g transform="translate(500, 130)">
      <!-- Pill 1: CYBERSECURITY in Mint Green -->
      <g transform="translate(-230, 0)">
        <rect x="-82" y="-13" width="164" height="26" rx="13" fill="#0e1b2f" stroke="#00f5a0" stroke-width="1.3"/>
        <path d="M-60 -4 L-54 -7 L-48 -4 C-48 1 -51 5 -54 7 C-57 5 -60 1 -60 -4 Z" fill="#00f5a0"/>
        <text x="8" y="4.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00f5a0">CYBERSECURITY</text>
      </g>

      <!-- Pill 2: FORENSICS & DSA in Vibrant Blue -->
      <g transform="translate(0, 0)">
        <rect x="-82" y="-13" width="164" height="26" rx="13" fill="#0e1b2f" stroke="#00d2ff" stroke-width="1.3"/>
        <path d="M-60 -6 L-67 1 L-61 1 L-64 7 L-57 0 L-62 0 Z" fill="#00d2ff"/>
        <text x="7" y="4.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#00d2ff">FORENSICS &amp; DSA</text>
      </g>

      <!-- Pill 3: HACKATHONS in Pearl Pink -->
      <g transform="translate(230, 0)">
        <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#0e1b2f" stroke="#ff9ac8" stroke-width="1.3"/>
        <circle cx="-56" cy="0" r="5" fill="none" stroke="#ff9ac8" stroke-width="1.5"/>
        <text x="6" y="4.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ff9ac8">HACKATHONS</text>
      </g>
    </g>
  </g>

  <!-- Frame -->
  <rect x="2" y="2" width="996" height="216" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Laser Border: Blue -> Green -> Pearl Pink -->
  <rect x="2" y="2" width="996" height="216" rx="19" fill="none" stroke="url(#f-bd-mix)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="240 2200" pathLength="2440">
    <animate attributeName="stroke-dashoffset" from="0" to="-2440" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>