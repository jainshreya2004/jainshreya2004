<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <linearGradient id="em-pk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="em-pk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180424"/>
      <stop offset="100%" stop-color="#0e0216"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="217" height="51" rx="14" fill="url(#em-pk-bg)" stroke="url(#em-pk-border)" stroke-width="1.5"/>

  <!-- Left Icon Circle -->
  <circle cx="30" cy="27" r="16" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-width="1"/>
  <!-- Mail Icon -->
  <g fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(21, 19)">
    <rect x="1" y="2" width="16" height="12" rx="2"/>
    <path d="M1 4l8 5 8-5"/>
  </g>

  <!-- Labels -->
  <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#fb7185">GET IN TOUCH</text>
  <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fdf2f8">Send an Email</text>

  <!-- Right Pulse Arrow -->
  <circle cx="194" cy="27" r="11" fill="#f43f5e" fill-opacity="0.25"/>
  <circle cx="194" cy="27" r="11" fill="none" stroke="#f43f5e" stroke-width="1.2">
    <animate attributeName="r" values="11;14;11" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M191 22.5 L196 27 L191 31.5" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
