<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <linearGradient id="ln-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ln-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect x="1.5" y="1.5" width="217" height="51" rx="14" fill="url(#ln-bg)" stroke="url(#ln-border)" stroke-width="1.5"/>

  <!-- Left Icon Circle -->
  <circle cx="30" cy="27" r="16" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
  <!-- LinkedIn 'in' Icon -->
  <g fill="#38bdf8" transform="translate(22, 19) scale(0.65)">
    <path d="M4.98 3.5c0 1.381-1.11 2.5-2.48 2.5s-2.48-1.119-2.48-2.5c0-1.38 1.11-2.5 2.48-2.5s2.48 1.12 2.48 2.5zm.02 4.5h-5v16h5v-16zm7.982 0h-4.968v16h4.969v-8.399c0-4.67 6.029-5.052 6.029 0v8.399h4.988v-10.131c0-7.88-8.922-7.593-11.018-3.714v-2.155z"/>
  </g>

  <!-- Labels -->
  <text x="56" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#38bdf8">LINKEDIN</text>
  <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Let's Connect</text>

  <!-- Right Action / Arrow -->
  <circle cx="194" cy="27" r="11" fill="#0284c7" fill-opacity="0.25"/>
  <circle cx="194" cy="27" r="11" fill="none" stroke="#38bdf8" stroke-width="1.2">
    <animate attributeName="r" values="11;14;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M191 22.5 L196 27 L191 31.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
