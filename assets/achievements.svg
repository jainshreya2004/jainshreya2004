<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Silver Gradient -->
    <linearGradient id="silver-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Bronze/Brown Gradient -->
    <linearGradient id="bronze-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#cd7f32"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blue-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="green-grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Finalist - Elite Hack 1.0 (GOLD) -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.1s" fill="freeze"/>
    <rect x="10" y="14" width="880" height="62" rx="14" fill="#0c1224" stroke="url(#gold-grad)" stroke-opacity="0.85" stroke-width="1.8"/>
    <rect x="10" y="24" width="5" height="42" rx="2.5" fill="#fbbf24"/>
    <circle cx="58" cy="45" r="20" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#fbbf24">★</text>
    <text x="100" y="41" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Finalist</text>
    <text x="100" y="63" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fde68a">Elite Hack 1.0 (National Hackathon)</text>
  </g>

  <!-- Card 2: Finalist - HackShodh (SILVER) -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="10" y="86" width="880" height="62" rx="14" fill="#0c1224" stroke="url(#silver-grad)" stroke-opacity="0.85" stroke-width="1.8"/>
    <rect x="10" y="96" width="5" height="42" rx="2.5" fill="#e2e8f0"/>
    <circle cx="58" cy="117" r="20" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="124" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">★</text>
    <text x="100" y="113" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Finalist</text>
    <text x="100" y="135" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#cbd5e1">HackShodh (CSJM University, Kanpur)</text>
  </g>

  <!-- Card 3: 5th Position - Aurigo InfraCode (BRONZE / BROWN) -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="10" y="158" width="880" height="62" rx="14" fill="#0c1224" stroke="url(#bronze-grad)" stroke-opacity="0.85" stroke-width="1.8"/>
    <rect x="10" y="168" width="5" height="42" rx="2.5" fill="#cd7f32"/>
    <circle cx="58" cy="189" r="20" fill="#cd7f32" fill-opacity="0.25" stroke="#cd7f32" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" fill="#fed7aa">5th</text>
    <text x="100" y="185" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">5th Position</text>
    <text x="100" y="207" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fbcfe8">Aurigo InfraCode Hackathon (IIIT Bangalore)</text>
  </g>

  <!-- Card 4: Waitlisted - Smart India Hackathon (VIBRANT BLUE) -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.7s" fill="freeze"/>
    <rect x="10" y="230" width="880" height="62" rx="14" fill="#0c1224" stroke="url(#blue-grad)" stroke-opacity="0.85" stroke-width="1.8"/>
    <rect x="10" y="240" width="5" height="42" rx="2.5" fill="#38bdf8"/>
    <circle cx="58" cy="261" r="20" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="268" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">W</text>
    <text x="100" y="257" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Waitlisted</text>
    <text x="100" y="279" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#bae6fd">Smart India Hackathon 2025</text>
  </g>

  <!-- Card 5: Selected - AI for Bharat (VIBRANT GREEN) -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.9s" fill="freeze"/>
    <rect x="10" y="302" width="880" height="62" rx="14" fill="#0c1224" stroke="url(#green-grad)" stroke-opacity="0.85" stroke-width="1.8"/>
    <rect x="10" y="312" width="5" height="42" rx="2.5" fill="#00f5a0"/>
    <circle cx="58" cy="333" r="20" fill="#00f5a0" fill-opacity="0.2" stroke="#00f5a0" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#00f5a0">✓</text>
    <text x="100" y="329" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Selected</text>
    <text x="100" y="351" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#a7f3d0">AI for Bharat 2026</text>
  </g>
</svg>