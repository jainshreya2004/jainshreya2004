<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="pk-sh" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Elite Hack 1.0 -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.1s" fill="freeze"/>
    <rect x="10" y="14" width="880" height="62" rx="14" fill="#180424" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="10" y="24" width="5" height="42" rx="2.5" fill="#ec4899"/>
    <circle cx="58" cy="45" r="20" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#f472b6">★</text>
    <text x="100" y="41" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8">Finalist</text>
    <text x="100" y="63" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fda4af">Elite Hack 1.0 (National Hackathon)</text>
  </g>

  <!-- Card 2: HackShodh -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="10" y="86" width="880" height="62" rx="14" fill="#180424" stroke="#f472b6" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="10" y="96" width="5" height="42" rx="2.5" fill="#f472b6"/>
    <circle cx="58" cy="117" r="20" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="124" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#f472b6">★</text>
    <text x="100" y="113" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8">Finalist</text>
    <text x="100" y="135" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fda4af">HackShodh (CSJM University, Kanpur)</text>
  </g>

  <!-- Card 3: Aurigo InfraCode Hackathon -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="10" y="158" width="880" height="62" rx="14" fill="#180424" stroke="#db2777" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="10" y="168" width="5" height="42" rx="2.5" fill="#db2777"/>
    <circle cx="58" cy="189" r="20" fill="#db2777" fill-opacity="0.18" stroke="#db2777" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#ff79c6">5th</text>
    <text x="100" y="185" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8">5th Position</text>
    <text x="100" y="207" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fda4af">Aurigo InfraCode Hackathon (IIIT Bangalore)</text>
  </g>

  <!-- Card 4: Smart India Hackathon -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.7s" fill="freeze"/>
    <rect x="10" y="230" width="880" height="62" rx="14" fill="#180424" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="10" y="240" width="5" height="42" rx="2.5" fill="#f43f5e"/>
    <circle cx="58" cy="261" r="20" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="268" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#fb7185">W</text>
    <text x="100" y="257" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8">Waitlisted</text>
    <text x="100" y="279" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fda4af">Smart India Hackathon 2025</text>
  </g>

  <!-- Card 5: AI for Bharat -->
  <g opacity="0" transform="translate(-40 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.9s" fill="freeze"/>
    <rect x="10" y="302" width="880" height="62" rx="14" fill="#180424" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="10" y="312" width="5" height="42" rx="2.5" fill="#ec4899"/>
    <circle cx="58" cy="333" r="20" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="2">
      <animate attributeName="r" values="20;22.5;20" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#f472b6">✓</text>
    <text x="100" y="329" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8">Selected</text>
    <text x="100" y="351" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" fill="#fda4af">AI for Bharat 2026</text>
  </g>
</svg>